<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#FFF4F8" />
<title>Becoming OS · My Life Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:#FFF4F8; --surface:#FFFFFF; --surface2:#FFEAF3; --border:#F6C8DB;
  --gold:#D99D45; --lavender:#C26B9E; --sage:#579C8A; --rose:#F03791; --dust:#8B77B7;
  --text:#43243A; --muted:#896E80;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
}
button { font-family:inherit; font-size:inherit; color:inherit; border:none; background:none;
  cursor:pointer; text-align:inherit; padding:0; margin:0; -webkit-appearance:none; appearance:none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
.serif { font-family: 'Fraunces', serif; }
.header { padding: 24px 16px 8px; }
.brand { color: var(--gold); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; margin:0; }
.tagline { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.main { padding: 0 16px 16px; display:flex; flex-direction:column; gap:16px; }
.muted { color: var(--muted); }
.text-xs { font-size: 12px; }
.text-sm { font-size: 14px; }
.text-xl { font-size: 20px; }
.card { background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
.card-gold { border-color: var(--gold); }
.row { display:flex; align-items:center; }
.col { display:flex; flex-direction:column; }
.between { justify-content: space-between; }
.gap1 { gap:4px; } .gap2 { gap:8px; } .gap3 { gap:12px; }
.col.gap2 { gap:8px; } .col.gap3 { gap:12px; }
.font-semibold { font-weight:600; }
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;}

.icon-btn { background:var(--surface); border-radius:999px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:16px; }

.orb-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; }
.orb { position:relative; width:128px; height:128px; }
.orb-glow { position:absolute; left:50%; top:50%; width:72%; height:72%; transform:translate(-50%,-50%); border-radius:50%; background:var(--gold); filter: blur(22px); transition: opacity .6s ease; }
.orb svg { transform: rotate(-90deg); }
.orb-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.orb-center .emoji { font-size: 26px; }
.orb-center .pct { font-size: 22px; font-weight:600; }

.section { border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--border); }
.section-head { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px; }
.section-body { padding: 0 14px 14px; display:flex; flex-direction:column; gap:8px; }
.chev { transition: transform .2s ease; color: var(--muted); display:inline-block; }
.chev.collapsed { transform: rotate(-90deg); }

.task { width:100%; display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; border:1.5px solid transparent; }
.task.featured { border-color: var(--gold); box-shadow: 0 0 18px rgba(242,169,59,0.2); }
.checkbox { flex-shrink:0; width:20px; height:20px; border-radius:999px; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:11px; }
.task-label { flex:1; min-width:0; }
.task-label .t { font-size:14px; font-weight:500; }
.task-label .time { font-size:11px; color:var(--muted); margin-top:2px; }
.done .t { color: var(--muted); text-decoration: line-through; }

.input, textarea, select {
  width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none;
}
textarea { resize:none; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance: textfield; }
input[type=date] { color-scheme: dark; }

.extra-row { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--surface2); }
.extra-row span.label { flex:1; font-size:14px; }
.extra-row.done span.label { color:var(--muted); text-decoration:line-through; }
.add-row { display:flex; gap:8px; }
.add-btn { background:var(--gold); border-radius:10px; width:40px; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:18px; font-weight:700; align-self:stretch; }
.icon-x { padding:6px; font-size:14px; color:var(--muted); }

.mini-orb { width:30px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.mini-orb-inner { width:22px; height:22px; border-radius:999px; background:var(--surface); }
.week-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.week-day { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; border-radius:12px; }
.week-day.active { background: var(--surface2); }

.progress { width:100%; height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; }
.progress-fill { height:100%; border-radius:999px; transition: width .4s ease; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; }
.stat-card .emoji { font-size:18px; }
.stat-card .val { font-size:22px; font-weight:600; }

.bar-chart { display:flex; align-items:flex-end; gap:6px; height:160px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
.bar { width:100%; border-radius:6px 6px 0 0; background:var(--gold); min-height:2px; }
.bar-label { font-size:9px; color:var(--muted); }

.priority-card { display:flex; gap:12px; }
.priority-icon { flex-shrink:0; width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:16px; }

.chip { font-size:11px; border-radius:999px; padding:4px 10px; }

.nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; justify-content:space-around; padding:8px 0; background:var(--surface); border-top:1px solid var(--border); }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 16px; color:var(--muted); font-size:11px; }
.nav-item.active { color:var(--gold); }
.nav-item .emoji { font-size:18px; }

body{background:linear-gradient(145deg,#FFF1F8,#FFF9F3 60%,#FCE3EF);}
.card,.section,.stat-card{box-shadow:0 5px 24px rgba(198,58,124,.065)}
.header{padding-top:28px}.brand{color:#E42C87;font-size:14px;letter-spacing:.12em}.tagline{font-size:12px}
.section-head{background:linear-gradient(90deg,#fff,#FFF0F7)}
.task{transition:transform .12s ease,background .2s}.task:active{transform:scale(.985)}
.task.featured{border-color:#ED3993;box-shadow:0 0 0 2px #FAD4E7}
.nav{background:#fff9fd;border-top:1px solid #F2C1D8;box-shadow:0 -5px 24px #e92b8912}
.nav-item.active{color:#EA2E8C}.nav-item{padding:8px 12px}
.orb-glow{background:#F03791}.orb-center .pct{color:#D91D77}
.add-btn{background:#EA2E8C;color:white}.progress-fill{background:#EA2E8C}
input,textarea,select{color-scheme:light}
@media(min-width:700px){#app{max-width:690px}.main{padding:0 24px 24px}.nav{max-width:690px}}

/* Add-ons retain the original Becoming OS visual language. */
.nav-item{flex:1;padding:8px 3px;min-width:0}
.compass-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.compass-tab{border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:12px 10px;text-align:left;min-height:65px}
.compass-tab.active{background:#FFF0F7;border-color:var(--rose);box-shadow:0 0 0 1px #FAD4E7}
.compass-tab small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.compass-tab strong{font-size:12px;line-height:1.4}
.compass-reading{white-space:pre-wrap;line-height:1.85;font-size:14px}
.compass-edit{min-height:250px;line-height:1.7}
.compass-details{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:14px}
.compass-details summary{cursor:pointer;font-weight:600}
.learning-checks{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.learning-checks label{font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== THEME ===================== */
const COLORS = {
  bg:'#FFF4F8', surface:'#FFFFFF', surface2:'#FFEAF3', border:'#F6C8DB',
  gold:'#D99D45', lavender:'#C26B9E', sage:'#579C8A', rose:'#F03791', dust:'#8B77B7',
  text:'#43243A', muted:'#896E80',
};
const CATEGORY_META = {
  faith:{color:COLORS.lavender, emoji:'✨'},
  growth:{color:COLORS.sage, emoji:'📈'},
  light:{color:COLORS.gold, emoji:'💡'},
  identity:{color:COLORS.rose, emoji:'🎥'},
  rest:{color:COLORS.dust, emoji:'🌙'},
};
const SECTION_META = {
  morning:{label:'Morning Rituals', emoji:'🌅', color:COLORS.lavender},
  growth:{label:'Work, Calling & Learning', emoji:'📈', color:COLORS.sage},
  light:{label:'Wellness & Nourishment', emoji:'💡', color:COLORS.gold},
  evening:{label:'Evening & Connection', emoji:'🌙', color:COLORS.dust},
};
const WEEKLY_TARGETS_META = {
 bible:{label:'Bible reading days',emoji:'📖',color:COLORS.lavender},
 study:{label:'Deep-study sessions',emoji:'📚',color:COLORS.sage},
 calls:{label:'Relationship call days',emoji:'📞',color:COLORS.gold},
 content:{label:'Real-estate content day',emoji:'🏡',color:COLORS.rose},
 lightGalleryPosts:{label:'Light Gallery Friday session',emoji:'💡',color:COLORS.dust}
};

/* ===================== DATE HELPERS ===================== */
function toISODate(d){ const yr=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return yr+'-'+mo+'-'+day; }
function todayISO(){ return toISODate(new Date()); }
function parseISO(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(dateStr,n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return toISODate(d); }
function getMonday(dateStr){ const d=parseISO(dateStr); const day=d.getDay(); const diff = day===0?-6:1-day; d.setDate(d.getDate()+diff); return toISODate(d); }
function dayName(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{weekday:'long'}); }
function shortDate(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function mod(n,m){ return ((n%m)+m)%m; }
const ANCHOR_MONDAY='2026-06-15';
function getWeekNumber(dateStr){ const monday=getMonday(dateStr); const diff=Math.round((parseISO(monday).getTime()-parseISO(ANCHOR_MONDAY).getTime())/86400000); return Math.floor(diff/7); }
function getWeekRotation(wn){ return { biweeklyOn: mod(wn,2)===0, outreachWoman: mod(wn,4)===0, outreachMan: mod(wn,4)===2 }; }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const IDENTITY_SECTIONS=[{"title": "My Spiritual Identity", "body": "I am a daughter of God, firmly rooted in Christ. I know whose I am, and I do not need to perform to earn my place in His love. I am called to intimacy with God, not merely religious activity. My life is an invitation for Christ to be seen and known.\n\nI am a priest in my family: I intercede, I stand in the gap, and I lead by the example of a life surrendered to God. I carry the Holy Spirit, and I make room for His wisdom, correction, and power. My words carry weight because I choose truth, prayer, and integrity. I am protected, guided, favored, and graced for the assignments entrusted to me.\n\nI do not mistake spiritual authority for control over people. I walk in courage and humility. I cultivate a living relationship with God, study His Word, obey what I learn, and trust Him with what I cannot control. I am a catalyst for deeper intimacy with Christ in my home and wherever I am sent. My mind, character, and results increasingly reflect Him."}, {"title": "My Inner World", "body": "I am secure in who I am. My worth is not measured by my bank balance, appearance, achievements, attention, or anybody’s approval. I can enjoy beautiful things and build wealth without using them to prove that I matter.\n\nI trust myself to notice what I feel, examine what I think, and make thoughtful decisions. I do not rush to defend my value or explain myself to everyone. I can be misunderstood without losing my center. I am emotionally regulated: I pause, discern, respond, and repair when I am wrong.\n\nI am both soft and strong. I know how to rest without guilt and work without panic. I release comparison, unnecessary pressure, and the urge to announce every move. I keep my own counsel, honor my boundaries, and let consistent action speak. I am becoming a woman whose peace comes from alignment, not from managing everybody’s opinion."}, {"title": "My Femininity & Presence", "body": "I am a powerhouse clothed in grace. My femininity is not performance, helplessness, or silence. It is a confident, grounded expression of the woman God made me to be.\n\nI am warm, bubbly, lighthearted, and kind. I bring joy into rooms without shrinking myself. I carry myself with elegance, dignity, and self-respect. I speak clearly, listen attentively, and make people feel seen while remaining discerning about access to me.\n\nI take pleasure in caring for my body and environment. My hygiene, health, grooming, wardrobe, and personal style express stewardship and delight, not desperation for validation. I dress with creativity and intention; I am free to become a fashion icon in my own distinctive way.\n\nI can be gracious and assertive at the same time. I say no without hostility, ask for what I need without apology, and receive compliments, generosity, and care without suspicion. My presence is memorable because it is genuine."}, {"title": "My Mind & Character", "body": "I am a woman of substance. I read widely, think critically, ask better questions, and put what I learn into practice. Knowledge is not decoration; it shapes my judgment, conversations, habits, and decisions.\n\nI communicate with clarity and precision. I do not use unnecessary words to prove intelligence. I am willing to learn, admit uncertainty, reconsider an opinion, and take correction without collapsing into shame. I build self-trust by keeping promises to myself and acting on sound judgment.\n\nI am courageous in uncomfortable conversations. I am assertive without aggression, gentle without passivity, and confident without arrogance. I recognize manipulation, maintain healthy boundaries, and choose integrity even when shortcuts are available.\n\nI value my name and reputation. I am meticulous about the quality of my work, fair in my dealings, generous where I can be, and accountable for the impact of my choices. My growth is visible in how I behave, not only in what I study."}, {"title": "My Purpose, Work & Abundance", "body": "I create value and multiply it. My work is a place to serve people with excellence, build lasting relationships, and steward opportunities wisely. I do not chase money at the expense of character, but I do not apologize for wanting financial abundance.\n\nIn real estate, I understand what I sell, communicate its value honestly, and serve intentional, financially capable buyers and investors with confidence. I cultivate strong relationships, follow through on commitments, negotiate clearly, and measure outcomes rather than confusing busyness with progress.\n\nI build my businesses with structure, creativity, discipline, and sound judgment. I learn the numbers, respect my time, delegate wisely, and make decisions from evidence rather than fear. I can earn well, travel, shop, invest, enjoy beauty, and live generously without letting possessions define me.\n\nLike Joseph, I want my growth to lift my family and create opportunities for others. Wealth is a tool for freedom, stewardship, and service. I trust God with the outcome while taking responsibility for the work in front of me."}, {"title": "My Love & Relationships", "body": "I am wise, openhearted, and cherished. I can love deeply without abandoning myself. I bring kindness, joy, honesty, and emotional maturity into my relationships, and I expect mutual respect.\n\nI am discerning about trust. I do not confuse attention with commitment, chemistry with character, or access with intimacy. I protect my peace and honor my boundaries. I do not entertain disrespect, unwanted sexual comments, or relationships that compromise my values.\n\nI am open to an intentional, affectionate, generous romantic relationship with a man who delights in caring for me and treats me tenderly. I can receive love, thoughtful gifts, and being spoiled without making them the measure of my worth. I also show up with care, wisdom, loyalty, and clear communication.\n\nI nurture family and friendships with presence and generosity. I communicate directly instead of testing people, and I choose repair when it is healthy. I remain whole whether I am alone or accompanied."}, {"title": "The Life I Live", "body": "I walk in alignment. My relationship with God, inner security, health, work, relationships, and joy belong to one life; they are not competing performances.\n\nI make room for prayer, learning, meaningful work, laughter, beauty, movement, and rest. I do not need to prove that I am constantly productive. I enjoy the present while building the future. I keep my routines sustainable, my promises realistic, and my priorities visible.\n\nI am a woman who travels, explores, dresses beautifully, earns with integrity, gives generously, and takes excellent care of herself. I have the wisdom to distinguish what matters from what merely looks impressive. I am free to change course when new evidence or new responsibilities require it.\n\nMy life is not a collection of declarations alone. Every day I embody them through one honest decision, one courageous conversation, one act of discipline, one boundary kept, or one kindness offered. I do my part with excellence and leave the rest to God. I am becoming who I say I am."}];

const COMPASS_DEFAULTS={
  why: "I want to honor God with my life, deepen my intimacy with Him, and make Christ known through my character. I want to elevate my family as Joseph did, create opportunities for people I am called to help, and enjoy a beautiful, abundant life without confusing wealth with worth.",
  priorities: "1. God and my spiritual formation\n2. Purpose and meaningful work\n3. My health, character, security, and personal growth\n4. Family and friendships\n5. People I am called to serve and help",
  values: "1. God is involved in every area of my life.\n2. The Bible is my foundation for truth.\n3. Growth means applying what I learn.\n4. I communicate clearly and respectfully.\n5. I cultivate self-trust and sound judgment.\n6. I choose a constructive perspective.\n7. I practice courage.\n8. I depend on the power of the Holy Spirit.\n9. I lead with kindness and love.\n10. I act with integrity in business.\n11. I protect my good name.\n12. I show up with confidence.\n13. I am generous and responsible.",
  boundaries: "1. I do not entertain sexual advances or sexual jokes from people outside my romantic relationship.\n2. I maintain approximately two feet of personal space where appropriate.\n3. I do not hold hands casually.\n4. I walk away from disrespect rather than arguing for basic dignity.\n5. Business meetings need a clear objective.\n6. I do not enter romantic relationships with business partners.\n7. I do not share personal items outside my family.\n8. I do not overshare plans or progress before they are established.\n9. I lend money no more than once per month, and only when I can afford it."
};
let compassSelected=new Date().getDay();
let compassEdit=false;
function identityBody(i){return data.compass.sections?.[i] ?? IDENTITY_SECTIONS[i].body;}
function saveIdentityBody(i,v){data.compass.sections ||= {};data.compass.sections[i]=v;saveData();}
function chooseIdentity(i){compassSelected=i;compassEdit=false;render();}
function editIdentity(){compassEdit=!compassEdit;render();}
function saveCompassField(key,v){data.compass[key]=v;saveData();}
function renderCompass(){
 const i=compassSelected, title=IDENTITY_SECTIONS[i].title;
 const dayLabels=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 return `<div class="card card-gold">
  <p class="serif" style="font-size:23px;margin:0 0 7px">My Compass 🧭</p>
  <p class="muted text-sm" style="line-height:1.6;margin:0">Your identity, values and boundaries — a private place to return to what matters.</p>
 </div>
 <div class="card">
  <div class="row between"><div><p class="serif font-semibold" style="font-size:19px;margin:0">✨ My Identity</p><p class="muted text-xs" style="margin:5px 0">One declaration each day · read morning and night</p></div><span style="font-size:24px">🌸</span></div>
  <div class="compass-tabs">${IDENTITY_SECTIONS.map((x,n)=>`<button class="compass-tab ${i===n?'active':''}" onclick="chooseIdentity(${n})" aria-pressed="${i===n}"><small>${dayLabels[n]}</small><strong>${escapeHtml(x.title)}</strong></button>`).join('')}</div>
 </div>
 <div class="card">
  <div class="row between" style="align-items:flex-start;gap:10px">
    <div><p class="muted text-xs" style="margin:0 0 5px">${dayLabels[i]} · Declaration ${i+1} of 7</p><p class="serif font-semibold" style="font-size:20px;margin:0 0 12px">${escapeHtml(title)}</p></div>
    <button class="icon-btn" style="border:1px solid var(--border);width:auto;padding:0 12px;font-size:12px" onclick="editIdentity()">${compassEdit?'Done':'Edit'}</button>
  </div>
  ${compassEdit?`<textarea class="compass-edit" oninput="saveIdentityBody(${i},this.value)">${escapeHtml(identityBody(i))}</textarea>`:`<div class="compass-reading">${escapeHtml(identityBody(i))}</div>`}
 </div>
 <div class="card"><p class="serif font-semibold" style="font-size:17px;margin:0 0 6px">The foundations 🌷</p><p class="muted text-xs" style="margin:0">Open a section to read or edit it.</p>
 ${[['why','🔥 My Why'],['priorities','🎯 My Priorities'],['values','💎 My Values'],['boundaries','🛡️ My Boundaries']].map(([key,label])=>`<details class="compass-details" style="margin-top:10px"><summary>${label}</summary><textarea class="compass-edit" style="margin-top:12px;min-height:160px" oninput="saveCompassField('${key}',this.value)">${escapeHtml(data.compass[key]??COMPASS_DEFAULTS[key])}</textarea></details>`).join('')}
 </div>`;
}

/* ===================== BECOMING ROUTINE ===================== */
const task=(id,label,time,category,section,extra={})=>({id,label,time,category,section,...extra});
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const scheduleStart='2026-10-18';
function everyN(date,anchor,n){let a=parseISO(anchor), b=parseISO(date);return b>=a&&Math.round((b-a)/86400000)%n===0;}
function dailyCore(day,date){
 const office=[1,3,5].includes(day),sun=day===0,thu=day===4;
 const x=[
 task('wake-pray','Wake, hydrate & pray','6:00am · water first','faith','morning'),
 task('meditation-am','Morning meditation','Gentle start · flexible','faith','morning'),
 task('affirm-6','Say today’s identity declaration','Morning · '+IDENTITY_SECTIONS[day].title,'faith','morning'),
 task('ginger','Ginger shot','Morning · daily','light','morning'),
 task('eggs','Two eggs + nourishing breakfast','Morning','light','morning'),
 task('supplements','Morning supplements','Calcium+C · D+K · omega 3-6-9 · B complex','light','morning'),
 task('oral-am','Morning oral-care ritual','Oil pull → brush → water floss → tongue scrape → mouthwash','light','morning'),
 ];
 if(office) x.push(task('bible-1','Bible reading · 1 of 3','20 minutes · morning','faith','morning'));
 else x.push(task('bible-1','Bible reading · 1 of 2','30 minutes · morning','faith','morning'));
 if([3,0].includes(day))x.push(task('fast','Fast · 6am–1pm','Only when medically well enough; take supplements with food as advised','faith','morning'));



 // Business blocks — one primary focus per session, no invented clock commitments.
 if(day===1)x.push(task('estate-mon','Real estate · CRM and pipeline','3 hours · review leads, qualify prospects and plan follow-ups','growth','growth',{featured:true}));
 if(day===2)x.push(task('estate-tue','Real estate · follow-ups','1 hour · contact warm leads','growth','growth'));
 if(day===3)x.push(task('estate-wed','Real estate · sales and relationships','2 hours · prospect and build relationships','growth','growth',{featured:true}));
 if(day===4){
   x.push(task('estate-thu','Real estate · follow-ups','1.5 hours · progress conversations','growth','growth'));

function getDefaultData(){return {days:{},weekly:{},finance:{personal:[],estate:[],light:[]},joy:[],goals:{carCurrent:0,carTarget:0,moveOutDate:'',dealsClosed:0,dealsTarget:5,weightCurrent:0,weightTarget:60}};}
function defaultWeekly(){return {bible:{current:0,target:7},study:{current:0,target:6},calls:{current:0,target:5},content:{current:0,target:1},lightGalleryPosts:{current:0,target:1}};}
function getWeeklyData(d,monday){ const old=d.weekly[monday]||{};return Object.fromEntries(Object.entries(defaultWeekly()).map(([k,v])=>[k,old[k]||v])); }
function computeDayStats(dateStr,d){
  const dayIndex=parseISO(dateStr).getDay();
  const tasks=getTasksForDay(dayIndex,dateStr);
  const dayData=(d.days&&d.days[dateStr])||{tasks:{},custom:[],journal:''};
  const custom=dayData.custom||[];
  const doneTasks=tasks.filter(t=>!t.optional&&dayData.tasks&&dayData.tasks[t.id]).length;
  const doneCustom=custom.filter(c=>c.done).length;
  const total=tasks.filter(t=>!t.optional).length+custom.length;
  const done=doneTasks+doneCustom;
  const pct = total===0?0:Math.round((done/total)*100);
  return {tasks,dayData,total,done,pct};
}

/* ===================== BACKUP / RESTORE ===================== */
function copyBackup(){
  const text=JSON.stringify(data);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById('copy-btn'); if(btn) btn.textContent='✓ Copied!';
      setTimeout(()=>{ const b=document.getElementById('copy-btn'); if(b) b.textContent='📋 Copy data'; },2000);
    }).catch(()=>{ const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); } });
  } else {
    const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); }
  }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='becoming-os-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreFromText(){ applyRestoredData(importText); }
function restoreFromFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>applyRestoredData(e.target.result);
  reader.readAsText(file);
}
function applyRestoredData(jsonString){
  const status=document.getElementById('backup-status');
  try{
    const parsed=JSON.parse(jsonString);
    if(!parsed||typeof parsed!=='object') throw new Error('bad');
    const defaults=getDefaultData();
    data = {
      checkins:parsed.checkins||{}, compass:parsed.compass||{}, videoWeeks:parsed.videoWeeks||{}, weekReviews:parsed.weekReviews||{}, taskRecovery:parsed.taskRecovery||{},
      days: parsed.days&&typeof parsed.days==='object'?parsed.days:{},
      weekly: parsed.weekly&&typeof parsed.weekly==='object'?parsed.weekly:{},
      goals: Object.assign({}, defaults.goals, parsed.goals||{}), finance:parsed.finance||{personal:[],estate:[],light:[]},joy:parsed.joy||[],
    };
    importText='';
    ensureExtras();
    saveData();
    render();
    const s=document.getElementById('backup-status');
    if(s){ s.textContent="Restored — everything's back."; s.style.color=COLORS.sage; }
  }catch(e){
    if(status){ status.textContent="That didn't look like valid backup data."; status.style.color=COLORS.rose; }
  }
}

 <div class="card"><p class="serif font-semibold">Your rhythm this week</p>${days.map((d,i)=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid ${COLORS.border}"><span>${dayName(d)} · ${stats[i].done}/${stats[i].total}</span><span style="color:${COLORS.rose};font-weight:600">${stats[i].pct}%</span></div>`).join('')}</div>${renderWeekExtras()}`;
}


function checkinStats(){
 const keys=Object.keys(data.checkins||{}).sort(), set=new Set(keys);
 let current=0,d=todayISO();
 while(set.has(d)){current++;d=addDays(d,-1);}
 if(current===0){d=addDays(todayISO(),-1);while(set.has(d)){current++;d=addDays(d,-1);}}
 let longest=0,run=0,prev='';
 keys.forEach(k=>{run=prev&&addDays(prev,1)===k?run+1:1;longest=Math.max(longest,run);prev=k;});
 return {current,longest};
}
function weekReport(monday){
 const days=Array.from({length:7},(_,i)=>addDays(monday,i));
 let done=0,total=0;
 const categories={};
 for(const date of days){
  if(date>todayISO())continue;
  const d=data.days?.[date];
  if(!d)continue;
  for(const t of getTasksForDay(parseISO(date).getDay(),date)){
   if(t.optional||data.taskRecovery?.[date]?.[t.id]==='skip')continue;
   total++;categories[t.category]||={done:0,total:0};categories[t.category].total++;
   if(d.tasks?.[t.id]){done++;categories[t.category].done++;}
  }
  for(const t of d.custom||[]){total++;if(t.done)done++;}
 }
 return {done,total,pct:total?Math.round(100*done/total):0,categories};
}
function saveWeekNote(monday,v){data.weekReviews[monday]=v;saveData();}
function markRecovered(date,id,action){
 data.taskRecovery[date] ||= {};
 data.taskRecovery[date][id]=action;
 saveData();render();
}
function renderWeekExtras(){
 const monday=getMonday(selectedDate),prior=addDays(monday,-7);
 const report=weekReport(prior);
 const recent=Array.from({length:8},(_,i)=>addDays(prior,-7*i));
 const missed=[];
 for(let n=1;n<=7;n++){
  const date=addDays(todayISO(),-n),d=data.days?.[date];
  if(!d)continue;
  getTasksForDay(parseISO(date).getDay(),date).forEach(t=>{
   if(!t.optional&&!d.tasks?.[t.id]&&!data.taskRecovery?.[date]?.[t.id]&&missed.length<8)missed.push({date,t});
  });
 }
 return `<div class="card">
 <p class="serif font-semibold" style="font-size:18px;margin:0 0 6px">Last week's reflection 🌷</p>
 <p class="muted text-xs">Week of ${shortDate(prior)} · recorded tasks only</p>
 <p class="serif" style="font-size:25px;color:${COLORS.rose};margin:6px 0">${report.pct}% <span class="muted text-xs">${report.done}/${report.total} completed</span></p>
 ${Object.entries(report.categories).map(([key,v])=>`<div class="row between text-xs" style="padding:5px 0"><span>${escapeHtml(CATEGORY_META[key]?.label||key)}</span><strong>${v.done}/${v.total}</strong></div>`).join('')}
 <p class="muted text-xs" style="margin-top:12px">What worked, what was difficult, and what will you adjust?</p>
 <textarea rows="4" placeholder="A short, honest weekly review..." oninput="saveWeekNote('${prior}',this.value)">${escapeHtml(data.weekReviews[prior]||'')}</textarea>
 </div>
 <div class="card"><p class="serif font-semibold" style="font-size:17px;margin:0 0 10px">Previous weeks 📈</p>
 ${recent.map(m=>{const r=weekReport(m);return `<div class="row between text-sm" style="padding:7px 0;border-bottom:1px solid var(--border)"><span>${shortDate(m)}</span><strong>${r.total?r.pct+'%':'—'}</strong></div>`}).join('')}
 <p class="muted text-xs">Older weeks without recorded check-offs are shown as unrecorded, not assumed failures.</p></div>
 ${missed.length?`<div class="card"><p class="serif font-semibold" style="font-size:17px;margin:0 0 8px">Unfinished tasks · choose what matters</p>
 <p class="muted text-xs">Move forward only what still deserves your time. No guilt and no automatic backlog.</p>
 ${missed.map(({date,t})=>`<div style="padding:9px 0;border-bottom:1px solid var(--border)"><div class="text-sm">${escapeHtml(t.label)} <span class="muted text-xs">· ${shortDate(date)}</span></div><div class="row gap2" style="margin-top:8px"><button class="chip" style="background:var(--surface2)" onclick="markRecovered('${date}','${t.id}','carry')">Keep in mind</button><button class="chip" style="background:var(--surface2)" onclick="markRecovered('${date}','${t.id}','skip')">Let go</button></div></div>`).join('')}</div>`:''}`;
}
function videoWeekKey(){return getMonday(todayISO());}
function videoData(){const key=videoWeekKey();return data.videoWeeks[key] ||= {title:'',url:'',lesson:'',practice:'',reflection:'',watched:false,revisited:false,applied:false};}
function saveVideo(k,v){videoData()[k]=v;saveData();}
function toggleVideo(k,v){saveVideo(k,v);render();}
function renderVideoWeek(){
 const v=videoData(), url=String(v.url||'').trim();
 const safe=/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url);
 return `<div class="card">
 <p class="serif font-semibold" style="font-size:18px;margin:0 0 6px">🎬 Video of the Week</p>
 <p class="muted text-xs">Optional · one video, one lesson, one real-life application. Not included in your completion score.</p>
 <input class="input" placeholder="Video title" aria-label="Video title" value="${escapeHtml(v.title)}" oninput="saveVideo('title',this.value)" style="margin-top:10px"/>
 <input class="input" placeholder="YouTube link" aria-label="YouTube link" value="${escapeHtml(v.url)}" oninput="saveVideo('url',this.value)" style="margin-top:8px"/>
 ${safe?`<p class="text-sm"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">▶ Watch this video ↗</a></p>`:''}
 <p class="muted text-xs">Key lesson</p><textarea rows="2" placeholder="What do I want to remember?" oninput="saveVideo('lesson',this.value)">${escapeHtml(v.lesson)}</textarea>
 <p class="muted text-xs">This week's practice</p><textarea rows="2" placeholder="One behavior to try..." oninput="saveVideo('practice',this.value)">${escapeHtml(v.practice)}</textarea>
 <div class="learning-checks">${[['watched','Watched'],['revisited','Revisited'],['applied','Practiced']].map(([k,label])=>`<label><input type="checkbox" ${v[k]?'checked':''} onchange="toggleVideo('${k}',this.checked)"> ${label}</label>`).join('')}</div>
 <p class="muted text-xs">What changed?</p><textarea rows="2" placeholder="Reflect at the end of the week..." oninput="saveVideo('reflection',this.value)">${escapeHtml(v.reflection)}</textarea>
 </div>`;
}
function financeHistory(kind){
 const items=(ensureFinance()[kind]||[]), months={};
 items.forEach(x=>{
  const key=String(x.date||'').slice(0,7)||'Unknown';
  months[key]||={count:0,totals:{}};
  months[key].count++;
  months[key].totals[x.type]=(months[key].totals[x.type]||0)+Number(x.amount||0);
 });
 return `<details style="margin-top:12px"><summary class="text-sm font-semibold" style="cursor:pointer">Monthly history & trends (${Object.keys(months).length} months)</summary>
 ${Object.keys(months).sort().reverse().map(month=>`<div class="card" style="margin-top:9px"><p class="serif font-semibold text-sm" style="margin:0 0 7px">${escapeHtml(month)} · ${months[month].count} entries</p>
 ${Object.entries(months[month].totals).map(([type,n])=>`<div class="row between text-xs" style="padding:4px 0"><span>${escapeHtml(type)}</span><strong>₦${Math.round(n).toLocaleString()}</strong></div>`).join('')}</div>`).join('')||'<p class="muted text-xs">No transactions recorded yet.</p>'}
 </details>`;
}

/* ===================== RENDER: GROWTH ===================== */
function renderGrowth(){
  const today=todayISO();
  const currentMonday=getMonday(today);
  const weeks=[];
  for(let i=7;i>=0;i--){
    const m=addDays(currentMonday,-7*i);
    const weekDates=Array.from({length:7},(_,j)=>addDays(m,j));
    const pcts=weekDates.map(d=>computeDayStats(d,data).pct);
    const avg=Math.round(pcts.reduce((s,x)=>s+x,0)/7);
    weeks.push({week:shortDate(m),pct:avg});
  }
  const checkins=checkinStats(); let streak=checkins.current;

  const maxBar=160;
  return `
    <div class="grid-2">
      <div class="stat-card"><span class="emoji">🔥</span><span class="val serif">${streak} ${streak===1?'day':'days'}</span><span class="muted text-xs">Daily check-in streak · longest ${checkins.longest} days · next ${[7,14,30,60,90].find(n=>n>streak)||'90+'}-day milestone</span></div>
      <div class="stat-card"><span class="emoji">📊</span><span class="val serif">${weeks[weeks.length-1].pct}%</span><span class="muted text-xs">This week · lit so far</span></div>
    </div>
    <div class="card">
      <p class="serif font-semibold text-sm" style="margin:0 0 12px;">8-Week Trend</p>
      <div class="bar-chart">
        ${weeks.map(w=>{
          const h=Math.max(2,(w.pct/100)*maxBar);
          const opacity=(0.35+(w.pct/100)*0.65).toFixed(2);
          return `<div class="bar-col"><div class="bar" style="height:${h}px;opacity:${opacity};"></div><span class="bar-label">${w.week}</span></div>`;
        }).join('')}
      </div>
    </div>
    <p class="muted text-xs" style="text-align:center;padding:0 16px;">Every bar is a week of seeds — planted, watered, some already harvested. The trend matters more than any single day.</p>`;
}

/* ===================== RENDER: VISION ===================== */
function renderPriority(emoji,color,title,desc){
  return `<div class="card priority-card">
    <div class="priority-icon" style="background:${color}22;">${emoji}</div>
    <div>
      <p class="serif font-semibold text-sm" style="margin:0;">${title}</p>
      <p class="muted text-xs" style="margin:4px 0 0;">${desc}</p>
    </div>
  </div>`;
}
function renderBackupCard(){
  return `
    <div class="card col gap2">
      <div class="row gap2"><span>📋</span><span class="serif font-semibold text-sm">Backup & Restore</span></div>
      <p class="muted text-xs" style="margin:0;">Your data lives in this browser only. Back it up regularly — especially before switching phones or browsers, or clearing browsing data.</p>
      <div class="row gap2">
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="copyBackup()" id="copy-btn">📋 Copy data</button>
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="downloadBackup()">⬇ Download file</button>
      </div>
      <textarea class="input" rows="2" readonly id="backup-text" onfocus="this.select()">${escapeHtml(JSON.stringify(data))}</textarea>
      <div style="height:1px;background:${COLORS.border};margin:4px 0;"></div>
      <p class="muted text-xs" style="margin:0;">Restore: paste backup text below, or choose a backup file.</p>
      <textarea class="input" rows="2" placeholder="Paste backup data here..." oninput="importText=this.value"></textarea>
      <input type="file" id="restore-file" accept="application/json,.json,.txt" style="display:none" onchange="restoreFromFile(this.files[0])" />
      <div class="row gap2">
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;background:${COLORS.gold};color:${COLORS.bg};border-color:${COLORS.gold};" onclick="restoreFromText()">⬆ Restore pasted</button>
        <button class="input" style="width:auto;flex:1;text-align:center;font-weight:600;" onclick="document.getElementById('restore-file').click()">📁 Choose file</button>
      </div>
      <p class="text-xs" id="backup-status" style="margin:0;min-height:14px;"></p>
    </div>`;
}
function ensureFinance(){if(!data.finance)data.finance={personal:[],estate:[],light:[]};return data.finance;}
function addFinance(kind){const amount=Number(document.getElementById('f-amount-'+kind)?.value);const type=document.getElementById('f-type-'+kind)?.value;const note=document.getElementById('f-note-'+kind)?.value||'';if(!Number.isFinite(amount)||amount<=0)return;ensureFinance()[kind].push({id:Date.now(),date:todayISO(),type,amount,note});saveData();render();}
function removeFinance(kind,id){ensureFinance()[kind]=ensureFinance()[kind].filter(x=>x.id!==id);saveData();render();}
function financeSummary(kind,items){
 const sum=type=>items.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount||0),0);
 const fmt=n=>'₦'+Math.round(n).toLocaleString();
 let lines=[];
 if(kind==='personal'){
  const income=sum('Salary')+sum('Commission')+sum('Other income');
  const spend=sum('Expense')+sum('Subscription');
  lines=[['Income',fmt(income)],['Spending',fmt(spend)],['Cash after spending',fmt(income-spend)],['Splurge transfers',fmt(sum('Splurge savings transfer'))],['Investment savings transfers',fmt(sum('Investment savings transfer'))],['Investment cost',fmt(sum('Investment purchase'))],['Investment latest value entries',fmt(sum('Investment current value'))]];
 }else if(kind==='estate'){
  const revenue=sum('Deal revenue')+sum('Commission income');
  const costs=sum('Partner share payout')+sum('Ads')+sum('Tools')+sum('Subscriptions')+sum('Other expense');
  lines=[['Revenue recorded',fmt(revenue)],['Costs and partner payouts',fmt(costs)],['Estimated net',fmt(revenue-costs)]];
 }else{
  const revenue=sum('Sale revenue');const costs=sum('Product cost')+sum('Owner salary')+sum('Ads')+sum('Packaging')+sum('Shipping')+sum('Other expense');
  lines=[['Sales',fmt(revenue)],['Gross profit',fmt(revenue-sum('Product cost'))],['Net after recorded costs',fmt(revenue-costs)],['Reinvestment transfers',fmt(sum('Reinvestment transfer'))]];
 }
 return `<div class="grid-2" style="margin-bottom:12px">${lines.map(([k,v])=>`<div class="stat-card"><span class="muted text-xs">${k}</span><strong>${v}</strong></div>`).join('')}</div><p class="muted text-xs">Transfers are shown separately, not double-counted as expenses. Investment value entries are snapshots, not automatically updated market prices.</p>`;
}
function financeCard(kind,label,options){const items=ensureFinance()[kind], totals={};items.forEach(x=>totals[x.type]=(totals[x.type]||0)+x.amount);return `<div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 8px">${label}</p>${financeSummary(kind,items)}<div class="grid-2">${options.map(o=>`<div class="stat-card"><span class="muted text-xs">${o}</span><strong>₦${(totals[o]||0).toLocaleString()}</strong></div>`).join('')}</div><div class="col gap2" style="margin-top:12px"><select id="f-type-${kind}">${options.map(o=>`<option>${o}</option>`).join('')}</select><input class="input" id="f-amount-${kind}" type="number" min="1" placeholder="Amount (₦)"/><input class="input" id="f-note-${kind}" placeholder="Note (optional)"/><button class="add-btn" style="width:100%;padding:10px" onclick="addFinance('${kind}')">+ Record transaction</button></div><div class="col gap2" style="margin-top:12px">${items.slice().reverse().map(x=>`<div class="row between text-xs"><span>${x.date} · ${escapeHtml(x.type)} · ₦${x.amount.toLocaleString()} ${escapeHtml(x.note)}</span><button onclick="removeFinance('${kind}',${x.id})">✕</button></div>`).join('')}</div>${financeHistory(kind)}</div>`;}
function addJoy(){const el=document.getElementById('joy-note');const v=el?.value.trim();const file=document.getElementById('joy-photo')?.files[0];if(!v&&!file)return;const store=(photo='')=>{if(!data.joy)data.joy=[];data.joy.push({id:Date.now(),date:todayISO(),text:v,photo});saveData();render();};if(file){if(file.size>1200000){alert('Choose a smaller photo (under 1.2 MB) so browser storage does not fill.');return;}const reader=new FileReader();reader.onload=()=>store(reader.result);reader.readAsDataURL(file);}else store();}
function deleteJoy(id){data.joy=(data.joy||[]).filter(x=>x.id!==id);saveData();render();}
function renderVision(){const g=data.goals;const carPct=g.carTarget>0?Math.min(100,Math.round(g.carCurrent/g.carTarget*100)):0;return `
 <div class="card card-gold"><p class="serif" style="font-size:22px;margin:0 0 8px">The woman I'm becoming ✨</p><p class="text-sm" style="line-height:1.7;margin:0">Grounded in Christ. Courageous in uncomfortable moments. Financially intentional. Emotionally present. Rested, nourished, and free to enjoy the life I'm building.</p><p style="color:${COLORS.rose};font-style:italic">I can work without pressure. I do my part and leave the rest to God.</p></div>
 <div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 10px">🌷 Joy Jar</p><p class="muted text-xs">Collect moments, not achievements.</p><textarea id="joy-note" placeholder="A little thing that made me happy..."></textarea><input class="input" id="joy-photo" type="file" accept="image/*" style="margin-top:8px"/><p class="muted text-xs">Optional small photo. Photos use browser storage, so export backups regularly.</p><button class="add-btn" style="width:100%;padding:10px;margin-top:8px" onclick="addJoy()">+ Add a moment</button>${(data.joy||[]).slice().reverse().map(x=>`<div class="card" style="margin-top:8px"><p class="text-sm">🌸 ${escapeHtml(x.text)} <span class="muted text-xs">${x.date}</span></p>${x.photo?`<img src="${x.photo}" alt="Joy Jar memory" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px"/>`:``}<button class="text-xs" onclick="deleteJoy(${x.id})">Remove</button></div>`).join('')}</div>
 <div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 10px">💗 Personal savings goal</p><div class="row gap2"><input class="input" type="number" value="${g.carCurrent}" aria-label="Saved amount" oninput="onCarInput('carCurrent',this.value)"/><span>of ₦</span><input class="input" type="number" value="${g.carTarget}" aria-label="Goal amount" oninput="onCarInput('carTarget',this.value)"/></div><div class="progress" style="margin-top:12px"><div id="car-bar" class="progress-fill" style="width:${carPct}%;background:${COLORS.rose}"></div></div><span class="text-xs muted" id="car-pct">${carPct}%</span><p class="muted text-xs">Set your own target when you're ready. Saving amounts can vary.</p></div>
 ${financeCard('personal','💗 Personal finances',['Salary','Commission','Other income','Expense','Subscription','Splurge savings transfer','Investment savings transfer','Investment purchase','Investment current value'])}
 ${financeCard('estate','🏡 Real estate finances',['Deal revenue','Commission income','Partner share payout','Ads','Tools','Subscriptions','Other expense'])}
 ${financeCard('light','💡 Light Gallery finances',['Sale revenue','Product cost','Reinvestment transfer','Owner salary','Ads','Packaging','Shipping','Other expense'])}
 ${renderBackupCard()}`;}

/* ===================== NAV + MAIN RENDER ===================== */
function renderNav(){
  const tabs=[['today','Today','☀️'],['week','Week','📅'],['growth','Growth','📊'],['vision','Vision','✨'],['compass','Compass','🧭']];
  return `<div class="nav">${tabs.map(([id,label,emoji])=>`
    <button class="nav-item ${activeTab===id?'active':''}" onclick="setTab('${id}')">
      <span class="emoji">${emoji}</span><span>${label}</span>
    </button>`).join('')}</div>`;
}
function render(){
  ensureExtras();
  const app=document.getElementById('app');
  let content='';
  if(activeTab==='today') content=renderToday();
  else if(activeTab==='week') content=renderWeek();
  else if(activeTab==='growth') content=renderGrowth()+renderVideoWeek();
  else if(activeTab==='vision') content=renderVision();
  else content=renderCompass();
  app.innerHTML = `
    <div class="header">
      <p class="brand serif">✿ Becoming OS</p>
      <p class="tagline">Rooted in grace. Growing in joy. · Saved on this device</p>
    </div>
    <div class="main">${content}</div>
    ${renderNav()}`;
}
render();
</script>
