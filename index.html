<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#FFF4F8" />
<title>Becoming OS · My Life Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg:#FFF4F8; --surface:#FFFFFF; --surface2:#FFEAF3; --border:#F6C8DB;
  --gold:#D99D45; --lavender:#C26B9E; --sage:#579C8A; --rose:#F03791; --dust:#8B77B7;
  --text:#43243A; --muted:#896E80;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
}
button { font-family:inherit; font-size:inherit; color:inherit; border:none; background:none;
  cursor:pointer; text-align:inherit; padding:0; margin:0; -webkit-appearance:none; appearance:none; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
.serif { font-family: 'Fraunces', serif; }
.header { padding: 24px 16px 8px; }
.brand { color: var(--gold); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; margin:0; }
.tagline { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.main { padding: 0 16px 16px; display:flex; flex-direction:column; gap:16px; }
.muted { color: var(--muted); }
.text-xs { font-size: 12px; }
.text-sm { font-size: 14px; }
.text-xl { font-size: 20px; }
.card { background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
.card-gold { border-color: var(--gold); }
.row { display:flex; align-items:center; }
.col { display:flex; flex-direction:column; }
.between { justify-content: space-between; }
.gap1 { gap:4px; } .gap2 { gap:8px; } .gap3 { gap:12px; }
.col.gap2 { gap:8px; } .col.gap3 { gap:12px; }
.font-semibold { font-weight:600; }
.mb1{margin-bottom:4px;} .mb2{margin-bottom:8px;}

.icon-btn { background:var(--surface); border-radius:999px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:16px; }

.orb-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; }
.orb { position:relative; width:128px; height:128px; }
.orb-glow { position:absolute; left:50%; top:50%; width:72%; height:72%; transform:translate(-50%,-50%); border-radius:50%; background:var(--gold); filter: blur(22px); transition: opacity .6s ease; }
.orb svg { transform: rotate(-90deg); }
.orb-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
.orb-center .emoji { font-size: 26px; }
.orb-center .pct { font-size: 22px; font-weight:600; }

.section { border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--border); }
.section-head { width:100%; display:flex; align-items:center; justify-content:space-between; padding:14px; }
.section-body { padding: 0 14px 14px; display:flex; flex-direction:column; gap:8px; }
.chev { transition: transform .2s ease; color: var(--muted); display:inline-block; }
.chev.collapsed { transform: rotate(-90deg); }

.task { width:100%; display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; border:1.5px solid transparent; }
.task.featured { border-color: var(--gold); box-shadow: 0 0 18px rgba(242,169,59,0.2); }
.checkbox { flex-shrink:0; width:20px; height:20px; border-radius:999px; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:11px; }
.task-label { flex:1; min-width:0; }
.task-label .t { font-size:14px; font-weight:500; }
.task-label .time { font-size:11px; color:var(--muted); margin-top:2px; }
.done .t { color: var(--muted); text-decoration: line-through; }

.input, textarea, select {
  width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:10px; padding:8px 10px; font-size:13px; font-family:inherit; outline:none;
}
textarea { resize:none; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type=number] { -moz-appearance: textfield; }
input[type=date] { color-scheme: dark; }

.extra-row { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; background:var(--surface2); }
.extra-row span.label { flex:1; font-size:14px; }
.extra-row.done span.label { color:var(--muted); text-decoration:line-through; }
.add-row { display:flex; gap:8px; }
.add-btn { background:var(--gold); border-radius:10px; width:40px; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:18px; font-weight:700; align-self:stretch; }
.icon-x { padding:6px; font-size:14px; color:var(--muted); }

.mini-orb { width:30px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.mini-orb-inner { width:22px; height:22px; border-radius:999px; background:var(--surface); }
.week-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.week-day { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; border-radius:12px; }
.week-day.active { background: var(--surface2); }

.progress { width:100%; height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; }
.progress-fill { height:100%; border-radius:999px; transition: width .4s ease; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; }
.stat-card .emoji { font-size:18px; }
.stat-card .val { font-size:22px; font-weight:600; }

.bar-chart { display:flex; align-items:flex-end; gap:6px; height:160px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
.bar { width:100%; border-radius:6px 6px 0 0; background:var(--gold); min-height:2px; }
.bar-label { font-size:9px; color:var(--muted); }

.priority-card { display:flex; gap:12px; }
.priority-icon { flex-shrink:0; width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:16px; }

.chip { font-size:11px; border-radius:999px; padding:4px 10px; }

.nav { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; justify-content:space-around; padding:8px 0; background:var(--surface); border-top:1px solid var(--border); }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 16px; color:var(--muted); font-size:11px; }
.nav-item.active { color:var(--gold); }
.nav-item .emoji { font-size:18px; }

body{background:linear-gradient(145deg,#FFF1F8,#FFF9F3 60%,#FCE3EF);}
.card,.section,.stat-card{box-shadow:0 5px 24px rgba(198,58,124,.065)}
.header{padding-top:28px}.brand{color:#E42C87;font-size:14px;letter-spacing:.12em}.tagline{font-size:12px}
.section-head{background:linear-gradient(90deg,#fff,#FFF0F7)}
.task{transition:transform .12s ease,background .2s}.task:active{transform:scale(.985)}
.task.featured{border-color:#ED3993;box-shadow:0 0 0 2px #FAD4E7}
.nav{background:#fff9fd;border-top:1px solid #F2C1D8;box-shadow:0 -5px 24px #e92b8912}
.nav-item.active{color:#EA2E8C}.nav-item{padding:8px 12px}
.orb-glow{background:#F03791}.orb-center .pct{color:#D91D77}
.add-btn{background:#EA2E8C;color:white}.progress-fill{background:#EA2E8C}
input,textarea,select{color-scheme:light}
@media(min-width:700px){#app{max-width:690px}.main{padding:0 24px 24px}.nav{max-width:690px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== THEME ===================== */
const COLORS = {
  bg:'#FFF4F8', surface:'#FFFFFF', surface2:'#FFEAF3', border:'#F6C8DB',
  gold:'#D99D45', lavender:'#C26B9E', sage:'#579C8A', rose:'#F03791', dust:'#8B77B7',
  text:'#43243A', muted:'#896E80',
};
const CATEGORY_META = {
  faith:{color:COLORS.lavender, emoji:'✨'},
  growth:{color:COLORS.sage, emoji:'📈'},
  light:{color:COLORS.gold, emoji:'💡'},
  identity:{color:COLORS.rose, emoji:'🎥'},
  rest:{color:COLORS.dust, emoji:'🌙'},
};
const SECTION_META = {
  morning:{label:'Morning Rituals', emoji:'🌅', color:COLORS.lavender},
  growth:{label:'Work, Calling & Learning', emoji:'📈', color:COLORS.sage},
  light:{label:'Wellness & Nourishment', emoji:'💡', color:COLORS.gold},
  evening:{label:'Evening & Connection', emoji:'🌙', color:COLORS.dust},
};
const WEEKLY_TARGETS_META = {
 bible:{label:'Bible reading days',emoji:'📖',color:COLORS.lavender},
 study:{label:'Deep-study sessions',emoji:'📚',color:COLORS.sage},
 calls:{label:'Relationship call days',emoji:'📞',color:COLORS.gold},
 content:{label:'Real-estate content day',emoji:'🏡',color:COLORS.rose},
 lightGalleryPosts:{label:'Light Gallery Friday session',emoji:'💡',color:COLORS.dust}
};

/* ===================== DATE HELPERS ===================== */
function toISODate(d){ const yr=d.getFullYear(), mo=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return yr+'-'+mo+'-'+day; }
function todayISO(){ return toISODate(new Date()); }
function parseISO(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(dateStr,n){ const d=parseISO(dateStr); d.setDate(d.getDate()+n); return toISODate(d); }
function getMonday(dateStr){ const d=parseISO(dateStr); const day=d.getDay(); const diff = day===0?-6:1-day; d.setDate(d.getDate()+diff); return toISODate(d); }
function dayName(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{weekday:'long'}); }
function shortDate(dateStr){ return parseISO(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function mod(n,m){ return ((n%m)+m)%m; }
const ANCHOR_MONDAY='2026-06-15';
function getWeekNumber(dateStr){ const monday=getMonday(dateStr); const diff=Math.round((parseISO(monday).getTime()-parseISO(ANCHOR_MONDAY).getTime())/86400000); return Math.floor(diff/7); }
function getWeekRotation(wn){ return { biweeklyOn: mod(wn,2)===0, outreachWoman: mod(wn,4)===0, outreachMan: mod(wn,4)===2 }; }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== BECOMING ROUTINE ===================== */
const task=(id,label,time,category,section,extra={})=>({id,label,time,category,section,...extra});
const DAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const scheduleStart='2026-10-18';
function everyN(date,anchor,n){let a=parseISO(anchor), b=parseISO(date);return b>=a&&Math.round((b-a)/86400000)%n===0;}
function dailyCore(day,date){
 const office=[1,3,5].includes(day),sun=day===0,thu=day===4;
 const x=[
 task('wake-pray','Wake, hydrate & pray','6:00am · water first','faith','morning'),
 task('meditation-am','Morning meditation','Gentle start · flexible','faith','morning'),
 task('affirm-6','Affirmation · 6:00am','Daily declaration · aim for any 3 of 5','faith','morning'),
 task('ginger','Ginger shot','Morning · daily','light','morning'),
 task('eggs','Two eggs + nourishing breakfast','Morning','light','morning'),
 task('supplements','Morning supplements','Calcium+C · D+K · omega 3-6-9 · B complex','light','morning'),
 task('oral-am','Morning oral-care ritual','Oil pull → brush → water floss → tongue scrape → mouthwash','light','morning'),
 ];
 if(office) x.push(task('bible-1','Bible reading · 1 of 3','20 minutes · morning','faith','morning'));
 else x.push(task('bible-1','Bible reading · 1 of 2','30 minutes · morning','faith','morning'));
 if([3,0].includes(day))x.push(task('fast','Fast · 6am–1pm','Only when medically well enough; take supplements with food as advised','faith','morning'));
 x.push(task('affirm-11','Affirmation · 11:00am','Second declaration · aim for 3 of 5','faith','growth'));
 x.push(task('affirm-15','Affirmation · 3:00pm','Third declaration · aim for 3 of 5','faith','growth'));
 if(!sun){
 x.push(task('study','Deep study · '+({1:'Real estate',2:'Spirituality & identity',3:'Selling skills',4:'Sales / real estate',5:'Femininity',6:'Femininity'}[day]),'9:30–10:30am · flexible if work conflicts','growth','growth'));
 }
 x.push(task('german','German practice','10 minutes · around 10:30am','growth','growth'));
 if([1,2,3,5,6].includes(day)){
 x.push(task('crm','Review CRM & relationship call list','Before calls','growth','growth'));
 x.push(task('calls','Real-estate relationship-building calls','1:00–3:00pm · Mon/Tue/Wed/Fri/Sat','growth','growth',{featured:true}));
 }
 if(!thu)x.push(task('sales-roleplay','Sales role-play with ChatGPT','20–30 minutes · flexible','growth','growth'));
 
 if([1,2,3,5].includes(day))x.push(task('ai-practice','AI tools practice','20 minutes · weekdays except content Thursday','growth','growth'));
 x.push(task('work-location',office?'Office day':(sun?'Sunday rest':'Work from home'),'Mon/Wed/Fri office · Tue/Thu WFH unless meetings','growth','growth',{optional:true}));
 if(office)x.push(task('gospel-video','Record gospel & identity TikTok','At the office · Mon/Wed/Fri','identity','growth'));
 if(day===2)x.push(task('cold','Real estate cold outreach','90 minutes · 3:00–4:30pm, after relationship calls','growth','growth'));
 if(thu)x.push(task('re-content','REAL ESTATE CONTENT DAY','Batch film, write, edit & schedule · most of day','growth','growth',{featured:true}));
 
 
 if(day===5)x.push(task('lighting-content','Light Gallery · AI content batching','2–3 hours · Friday','light','growth'));
 if(office)x.push(task('bible-2','Bible reading · 2 of 3','20 minutes · afternoon','faith','growth'));
 if(day===2)x.push(task('family','Family connection','Tuesday evening · 15–20 minutes','rest','evening'));
 if(day===6){
 x.push(task('book-check','Monthly book progress','Read one book per month · no need to rush','growth','evening',{optional:true}));
 x.push(task('sanitation','Saturday sanitation & personal care','Clean bathroom · body scrub · shave · reset','light','growth'));
 x.push(task('crm-week','CRM review & next-week call plan','Saturday night · no outreach','growth','evening'));
 
 x.push(task('wind-down-week','Wind down for Sunday rest','Saturday night','rest','evening'));
 }
 if(sun){
 x.push(task('rest','Protected Sunday rest','No real-estate calls or work tasks','rest','growth'));
 x.push(task('prayer-friend','Prayer with friend','2:00–4:00pm','faith','growth'));
 if(everyN(date,'2026-11-01',14))x.push(task('swim','Swimming for enjoyment','Every other Sunday · arrange outside 2–4pm prayer','rest','growth'));
 if(everyN(date,'2026-10-18',21))x.push(task('solo-date','Solo outing / drinks','Sunday evening · every 3 weeks','rest','evening'));
 x.push(task('weekly-reflection','Weekly emotional reflection','During Sunday walk · no pressure','rest','evening'));
 }
 if(everyN(date,'2026-10-16',14)&&day===5)x.push(task('fruit-shop','Buy fruit for the next two weeks','Friday · pineapple / apple / seasonal fruit','light','growth'));
 if(everyN(date,'2026-10-17',28)&&day===6)x.push(task('grooming','Hair, lashes & nails appointment','Every four weeks · flexible weekend slot','rest','growth'));
 if(date==='2026-12-18')x.push(task('travel-purchase','Travel preparation · purchase reminder','Physician’s Choice digestive enzymes and 60 Billion probiotic · check suitability with clinician','light','growth'));
 if(date>='2026-10-13'&&date<='2026-10-21'){x.push(task('foundation-sermons','Foundation School · four sermons','Temporary course intensive · pace for recovery','faith','growth'));x.push(task('foundation-prayer','Foundation School · four hours prayer','Temporary course intensive · adjust for health','faith','growth'));}
 if(date>='2026-10-22'&&parseISO(date).getDate()===22)x.push(task('foundation-monthly','Foundation School · monthly check-in','Check course dates; update your calendar','faith','growth',{optional:true}));
 if(date==='2026-10-23')x.push(task('foundation-next','Foundation School · next course begins','Check the new course timetable before adding daily intensive tasks','faith','growth'));
 if(date.startsWith('2026-10')&&day===6)x.push(task('swimming-lessons','October swimming lesson','Add your booked lesson time; only attend when well','rest','growth',{optional:true}));
 if(everyN(date,'2026-10-17',14)&&day===6)x.push(task('friendship','Friendship check-in','Every other Saturday · flexible','rest','evening'));
 if(day===5)x.push(task('boyfriend','Relationship conversation with boyfriend','Friday night · set phone alarm for Saturday 12:00am','rest','evening'));
 if(!office)x.push(task('bible-2','Bible reading · 2 of 2','30 minutes · later in day','faith','evening'));
 else x.push(task('bible-3','Bible reading · 3 of 3','20 minutes · evening','faith','evening'));
 x.push(task('spontaneous-prayer','Spontaneous prayer / speak with God','Anytime · no fixed quota','faith','evening',{optional:true}));
 x.push(task('shadow-work','Open existing shadow-work diary','Only when helpful · do not duplicate journal','rest','evening',{optional:true}));
 x.push(task('future-script','Open existing future-self scripting diary','Optional reflection · separate from audio journal','rest','evening',{optional:true}));
 x.push(task('affirm-19','Affirmation · 7:00pm','Fourth declaration · aim for 3 of 5','faith','evening'));
 x.push(task('affirm-2350','Affirmation · 11:50pm','Fifth declaration · optional if already asleep','faith','evening',{optional:true}));
 x.push(task('fruit-drink','Fresh blended fruit drink','Every other day · rotate available fruit','light','evening',{alternate:true}));
 x.push(task('reading','Read a book','20 minutes · night wind-down','growth','evening'));
 if([2,4,0].includes(day))x.push(task('walk','Contemplative prayer walk','8:30pm · phone-free estate walk','faith','evening'));
 x.push(task('sunday-joy', 'Unstructured enjoyment','Rest and pleasure are allowed · no quota','rest','evening',{optional:true}));
 x.push(task('oral-pm','Evening oral-care ritual','Oil pull → brush → water floss → tongue scrape → mouthwash','light','evening'));
 x.push(task('audio-journal','Audio journal','Anytime · ideally before bed','rest','evening'));
 x.push(task('sleep','Sleep routine','11:30pm bedtime goal · 6am wake is 6½h; aim for more rest when possible','rest','evening'));
 if(everyN(date,'2026-10-18',7)&&sun)x.push(task('joy-moment','Add a moment to your Joy Jar','Photo / memory / gratitude · optional','rest','evening',{optional:true}));
 return x.filter(t=>!t.biweekly && (!t.alternate || Math.round((parseISO(date)-parseISO('2026-10-14'))/86400000)%2===0));
}
function getTasksForDay(dayIndex,dateStr){
 const base=dailyCore(dayIndex,dateStr);
 const removed=new Set(['study','crm','calls','sales-roleplay','ai-practice','work-location','gospel-video','cold','re-content','lighting-content','crm-week','foundation-sermons','foundation-prayer','foundation-monthly','foundation-next','affirm-6','affirm-11','affirm-15','affirm-19','affirm-2350','audio-journal','oral-pm','wind-down-week']);
 const x=base.filter(t=>!removed.has(t.id));
 x.push(task('gratitude','Gratitude Journal','Evening · notice what went well','rest','evening'));
 x.push(task('night-wind-down','Nighttime Wind-Down (Shower & Hygiene)','Evening · shower, hygiene and settle','rest','evening'));
 if(dateStr>='2026-12-19'&&dateStr<='2027-01-17'&&dayIndex!==0)x.push(task('exam-prep','Spiritual course · exam preparation','Review sermons, notes and practice questions','faith','growth',{featured:true}));
 if(dayIndex!==0){
  const real={1:[['crm','Real estate · CRM, pipeline & follow-ups','3 hours']],2:[['re-follow','Real estate · client follow-ups','1 hour']],3:[['re-sales','Real estate · sales & relationships','2 hours']],4:[['re-film','Real estate · follow-ups & video recording','1½ hours · filming Thursday']],5:[['re-close','Real estate · conversions & CRM','2½ hours']],6:[['re-review','Real estate · weekly pipeline review','45 minutes']]}[dayIndex]||[];
  real.forEach(([id,label,time])=>x.push(task(id,label,time,'growth','growth',{featured:true})));
  if([2,4].includes(dayIndex))x.push(task('lg-focus','Light Gallery · content, marketing, ads & sales','2½ hours · dedicated focus','light','growth'));
  if(dayIndex===5)x.push(task('lg-check','Light Gallery · sales check','30 minutes','light','growth'));
  if(dayIndex===6)x.push(task('lg-review','Light Gallery · weekly review','45 minutes','light','growth'));
  if([3,6].includes(dayIndex))x.push(task('maintenance','Maintenance partnership · preparation','1 hour · no operational commitment yet','growth','growth'));
  if(dateStr>='2026-10-20'&&dateStr<='2026-12-18'){
   const plan={1:2,2:1,3:1,4:2,5:1,6:1};
   for(let i=1;i<=plan[dayIndex];i++)x.push(task('sermon-'+i,'Compulsory sermon '+i+' of '+plan[dayIndex],'60–90 minutes · Sermon Project','faith','growth'));
   if([2,3,5,6].includes(dayIndex))x.push(task('optional-sermon','Optional Curriculum Map sermon','Only if compulsory work and rest allow','faith','growth',{optional:true}));
   if([1,3,5,6].includes(dayIndex))x.push(task('prayer-block','Focused prayer block','Up to 2 hours · log actual hours below','faith','growth'));
  }
 }
 if(dayIndex===0)x.push(task('weekly-review','Gentle weekly review','10–15 minutes · optional on Sunday','rest','evening',{optional:true}));
 return x;
}
/* ===================== APP DATA ===================== */
function getDefaultData(){return {days:{},weekly:{},finance:{personal:[],estate:[],light:[]},joy:[],checkins:{},weeklyHistory:{},outcomes:{},prayerHours:{},taskDecisions:{},minimumDays:{},compassEdits:{},goals:{carCurrent:0,carTarget:0,moveOutDate:'',dealsClosed:0,dealsTarget:5,weightCurrent:0,weightTarget:60}};}
function defaultWeekly(){return {bible:{current:0,target:7},study:{current:0,target:6},calls:{current:0,target:5},content:{current:0,target:1},lightGalleryPosts:{current:0,target:1}};}
function getWeeklyData(d,monday){ const old=d.weekly[monday]||{};return Object.fromEntries(Object.entries(defaultWeekly()).map(([k,v])=>[k,old[k]||v])); }
function computeDayStats(dateStr,d){
  const dayIndex=parseISO(dateStr).getDay();
  const tasks=getTasksForDay(dayIndex,dateStr);
  const dayData=(d.days&&d.days[dateStr])||{tasks:{},custom:[],journal:''};
  const custom=dayData.custom||[];
  const doneTasks=tasks.filter(t=>!t.optional&&dayData.tasks&&dayData.tasks[t.id]).length;
  const doneCustom=custom.filter(c=>c.done).length;
  const total=tasks.filter(t=>!t.optional).length+custom.length;
  const done=doneTasks+doneCustom;
  const pct = total===0?0:Math.round((done/total)*100);
  return {tasks,dayData,total,done,pct};
}

/* ===================== STATE ===================== */
const STORAGE_KEY='becoming-os-data-v1';
function loadData(){
  try { const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); } catch(e){}
  return getDefaultData();
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }

let data = loadData();
function initNewData(){const def=getDefaultData();['checkins','weeklyHistory','outcomes','prayerHours','taskDecisions','minimumDays','compassEdits'].forEach(k=>{if(!data[k]||typeof data[k]!=='object')data[k]=def[k];});}
initNewData();
function recordCheckin(){const d=todayISO();if(!data.checkins[d]){data.checkins[d]=true;saveData();}}
function streakStats(){let current=0,day=todayISO();if(!data.checkins[day])day=addDays(day,-1);while(data.checkins[day]){current++;day=addDays(day,-1);}let best=0,n=0,prev='';Object.keys(data.checkins).filter(k=>data.checkins[k]).sort().forEach(k=>{n=prev&&addDays(prev,1)===k?n+1:1;best=Math.max(best,n);prev=k;});return {current,best,total:Object.values(data.checkins).filter(Boolean).length};}

/* ===================== MUTATIONS ===================== */
function ensureDay(dateStr){ if(!data.days[dateStr]) data.days[dateStr]={tasks:{},custom:[],journal:''}; return data.days[dateStr]; }
function toggleTask(taskId){ const day=ensureDay(selectedDate); day.tasks[taskId]=!day.tasks[taskId]; if(day.tasks[taskId]&&data.taskDecisions[selectedDate])delete data.taskDecisions[selectedDate][taskId]; saveData(); render(); }
function addCustomTask(){
  const input=document.getElementById('new-task-input');
  const text=(input&&input.value||'').trim();
  if(!text) return;
  const day=ensureDay(selectedDate);
  day.custom.push({id:'c-'+Date.now(), text, done:false});
  saveData(); render();
}
function toggleCustom(id){ const day=ensureDay(selectedDate); const c=day.custom.find(c=>c.id===id); if(c) c.done=!c.done; saveData(); render(); }
function deleteCustom(id){ const day=ensureDay(selectedDate); day.custom=day.custom.filter(c=>c.id!==id); saveData(); render(); }
function updateJournal(text){ const day=ensureDay(selectedDate); day.journal=text; saveData(); }
function changeDate(delta){ selectedDate=addDays(selectedDate,delta); render(); }
function toggleSection(sec){ collapsedSections[sec]=!collapsedSections[sec]; render(); }
function setTab(tab){ activeTab=tab; render(); }
function jumpToDay(d){ selectedDate=d; activeTab='today'; render(); }

function onWeeklyInput(monday,key,field,val){
  if(!data.weekly[monday]) data.weekly[monday]=defaultWeekly();
  data.weekly[monday][key][field]=Number(val)||0;
  saveData();
  const v=data.weekly[monday][key];
  const pct = v.target>0 ? Math.min(100, Math.round((v.current/v.target)*100)) : 0;
  const bar=document.getElementById('out-'+key+'-bar'); if(bar) bar.style.width=pct+'%';
  updateGoalScore(monday);
}
function updateGoalScore(monday){
  const weekly=getWeeklyData(data,monday);
  const pcts=Object.values(weekly).map(v=>v.target>0?Math.min(100,(v.current/v.target)*100):0);
  const score=Math.round(pcts.reduce((s,x)=>s+x,0)/pcts.length);
  const el=document.getElementById('goal-score-val'); if(el) el.textContent=score+'%';
}
function onCarInput(field,val){
  data.goals[field]=Number(val)||0;
  saveData();
  const g=data.goals;
  const pct=g.carTarget>0?Math.min(100,Math.round((g.carCurrent/g.carTarget)*100)):0;
  const bar=document.getElementById('car-bar'); if(bar) bar.style.width=pct+'%';
  const pctEl=document.getElementById('car-pct'); if(pctEl) pctEl.textContent=pct+'%';
}
function onMoveOutChange(val){
  data.goals.moveOutDate=val;
  saveData();
  const days=Math.ceil((parseISO(val).getTime()-parseISO(todayISO()).getTime())/86400000);
  const el=document.getElementById('moveout-days'); if(el) el.textContent = days>0?days+' days':'Time to go 🎉';
}
function adjustDeals(delta){
  data.goals.dealsClosed=Math.max(0,data.goals.dealsClosed+delta);
  saveData(); render();
}
function onWeightInput(val){
  data.goals.weightCurrent=Number(val)||0;
  saveData();
  const g=data.goals;
  const pct=g.weightTarget>0?Math.min(100,Math.round((g.weightCurrent/g.weightTarget)*100)):0;
  const bar=document.getElementById('weight-bar'); if(bar) bar.style.width=pct+'%';
}

/* ===================== BACKUP / RESTORE ===================== */
function copyBackup(){
  const text=JSON.stringify(data);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById('copy-btn'); if(btn) btn.textContent='✓ Copied!';
      setTimeout(()=>{ const b=document.getElementById('copy-btn'); if(b) b.textContent='📋 Copy data'; },2000);
    }).catch(()=>{ const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); } });
  } else {
    const ta=document.getElementById('backup-text'); if(ta){ ta.focus(); ta.select(); }
  }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='becoming-os-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreFromText(){ applyRestoredData(importText); }
function restoreFromFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>applyRestoredData(e.target.result);
  reader.readAsText(file);
}
function applyRestoredData(jsonString){
  const status=document.getElementById('backup-status');
  try{
    const parsed=JSON.parse(jsonString);
    if(!parsed||typeof parsed!=='object') throw new Error('bad');
    const defaults=getDefaultData();
    data = {
      ...defaults, ...parsed,
      days: parsed.days&&typeof parsed.days==='object'?parsed.days:{},
      weekly: parsed.weekly&&typeof parsed.weekly==='object'?parsed.weekly:{},
      goals: Object.assign({}, defaults.goals, parsed.goals||{}), finance:parsed.finance||{personal:[],estate:[],light:[]},joy:parsed.joy||[],
    };
    initNewData();
    importText='';
    saveData();
    render();
    const s=document.getElementById('backup-status');
    if(s){ s.textContent="Restored — everything's back."; s.style.color=COLORS.sage; }
  }catch(e){
    if(status){ status.textContent="That didn't look like valid backup data."; status.style.color=COLORS.rose; }
  }
}

/* ===================== RENDER: GROWTH ===================== */
function renderGrowth(){
  const today=todayISO();
  const currentMonday=getMonday(today);
  const weeks=[];
  for(let i=7;i>=0;i--){
    const m=addDays(currentMonday,-7*i);
    const weekDates=Array.from({length:7},(_,j)=>addDays(m,j));
    const pcts=weekDates.map(d=>computeDayStats(d,data).pct);
    const avg=Math.round(pcts.reduce((s,x)=>s+x,0)/7);
    weeks.push({week:shortDate(m),pct:avg});
  }
  const streak=streakStats().current, longest=streakStats().best;

  const maxBar=160;
  return `
    <div class="grid-2">
      <div class="stat-card"><span class="emoji">🔥</span><span class="val serif">${streak} ${streak===1?'day':'days'}</span><span class="muted text-xs">Daily app check-ins · longest ${longest} days</span></div>
      <div class="stat-card"><span class="emoji">📊</span><span class="val serif">${weeks[weeks.length-1].pct}%</span><span class="muted text-xs">This week · lit so far</span></div>
    </div>
    <div class="card"><p class="serif font-semibold text-sm">🏅 Streak milestones</p><p class="muted text-xs">${[7,14,30,60,90].map(n=>longest>=n?'🏆 '+n+' days':'○ '+n+' days').join(' · ')}</p></div>
    <div class="card">
      <p class="serif font-semibold text-sm" style="margin:0 0 12px;">8-Week Trend</p>
      <div class="bar-chart">
        ${weeks.map(w=>{
          const h=Math.max(2,(w.pct/100)*maxBar);
          const opacity=(0.35+(w.pct/100)*0.65).toFixed(2);
          return `<div class="bar-col"><div class="bar" style="height:${h}px;opacity:${opacity};"></div><span class="bar-label">${w.week}</span></div>`;
        }).join('')}
      </div>
    </div>
    <p class="muted text-xs" style="text-align:center;padding:0 16px;">Every bar is a week of seeds — planted, watered, some already harvested. The trend matters more than any single day.</p>`;

function renderBackupCard(){

function ensureFinance(){if(!data.finance)data.finance={personal:[],estate:[],light:[]};return data.finance;}
function addFinance(kind){const amount=Number(document.getElementById('f-amount-'+kind)?.value);const type=document.getElementById('f-type-'+kind)?.value;const note=document.getElementById('f-note-'+kind)?.value||'';const transactionDate=document.getElementById('f-date-'+kind)?.value||todayISO();if(!Number.isFinite(amount)||amount<=0)return;ensureFinance()[kind].push({id:Date.now(),date:transactionDate,type,amount,note});saveData();render();}
function removeFinance(kind,id){ensureFinance()[kind]=ensureFinance()[kind].filter(x=>x.id!==id);saveData();render();}
function financeSummary(kind,items){
 const sum=type=>items.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount||0),0);
 const fmt=n=>'₦'+Math.round(n).toLocaleString();
 let lines=[];
 if(kind==='personal'){
  const income=sum('Salary')+sum('Commission')+sum('Other income');
  const spend=sum('Expense')+sum('Subscription');
  lines=[['Income',fmt(income)],['Spending',fmt(spend)],['Cash after spending',fmt(income-spend)],['Splurge transfers',fmt(sum('Splurge savings transfer'))],['Investment savings transfers',fmt(sum('Investment savings transfer'))],['Investment cost',fmt(sum('Investment purchase'))],['Investment latest value entries',fmt(sum('Investment current value'))]];
 }else if(kind==='estate'){
  const revenue=sum('Deal revenue')+sum('Commission income');
  const costs=sum('Partner share payout')+sum('Ads')+sum('Tools')+sum('Subscriptions')+sum('Other expense');
  lines=[['Revenue recorded',fmt(revenue)],['Costs and partner payouts',fmt(costs)],['Estimated net',fmt(revenue-costs)]];
 }else{
  const revenue=sum('Sale revenue');const costs=sum('Product cost')+sum('Owner salary')+sum('Ads')+sum('Packaging')+sum('Shipping')+sum('Other expense');
  lines=[['Sales',fmt(revenue)],['Gross profit',fmt(revenue-sum('Product cost'))],['Net after recorded costs',fmt(revenue-costs)],['Reinvestment transfers',fmt(sum('Reinvestment transfer'))]];
 }
 return `<div class="grid-2" style="margin-bottom:12px">${lines.map(([k,v])=>`<div class="stat-card"><span class="muted text-xs">${k}</span><strong>${v}</strong></div>`).join('')}</div><p class="muted text-xs">Transfers are shown separately, not double-counted as expenses. Investment value entries are snapshots, not automatically updated market prices.</p>`;
}
function financeCard(kind,label,options){const all=ensureFinance()[kind];const items=all.filter(x=>financePeriod==='all'||(financePeriod==='month'?x.date?.slice(0,7)===financeMonth:x.date?.slice(0,4)===financeMonth.slice(0,4))), totals={};items.forEach(x=>totals[x.type]=(totals[x.type]||0)+x.amount);return `<div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 8px">${label}</p>${financeSummary(kind,items)}<div class="grid-2">${options.map(o=>`<div class="stat-card"><span class="muted text-xs">${o}</span><strong>₦${(totals[o]||0).toLocaleString()}</strong></div>`).join('')}</div><div class="col gap2" style="margin-top:12px"><select id="f-type-${kind}">${options.map(o=>`<option>${o}</option>`).join('')}</select><input class="input" id="f-amount-${kind}" type="number" min="1" placeholder="Amount (₦)"/><input class="input" type="date" id="f-date-${kind}" value="${todayISO()}"/><input class="input" id="f-note-${kind}" placeholder="Note (optional)"/><button class="add-btn" style="width:100%;padding:10px" onclick="addFinance('${kind}')">+ Record transaction</button></div><div class="col gap2" style="margin-top:12px">${items.slice().reverse().map(x=>`<div class="row between text-xs"><span>${x.date} · ${escapeHtml(x.type)} · ₦${x.amount.toLocaleString()} ${escapeHtml(x.note)}</span><button onclick="removeFinance('${kind}',${x.id})">✕</button></div>`).join('')}</div></div>`;}
function addJoy(){const el=document.getElementById('joy-note');const v=el?.value.trim();const file=document.getElementById('joy-photo')?.files[0];if(!v&&!file)return;const store=(photo='')=>{if(!data.joy)data.joy=[];data.joy.push({id:Date.now(),date:todayISO(),text:v,photo});saveData();render();};if(file){if(file.size>1200000){alert('Choose a smaller photo (under 1.2 MB) so browser storage does not fill.');return;}const reader=new FileReader();reader.onload=()=>store(reader.result);reader.readAsDataURL(file);}else store();}
function deleteJoy(id){data.joy=(data.joy||[]).filter(x=>x.id!==id);saveData();render();}
function renderVision(){const g=data.goals;const carPct=g.carTarget>0?Math.min(100,Math.round(g.carCurrent/g.carTarget*100)):0;return `
 <div class="card card-gold"><p class="serif" style="font-size:22px;margin:0 0 8px">The woman I'm becoming ✨</p><p class="text-sm" style="line-height:1.7;margin:0">Grounded in Christ. Courageous in uncomfortable moments. Financially intentional. Emotionally present. Rested, nourished, and free to enjoy the life I'm building.</p><p style="color:${COLORS.rose};font-style:italic">I can work without pressure. I do my part and leave the rest to God.</p></div>
 <div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 10px">🌷 Joy Jar</p><p class="muted text-xs">Collect moments, not achievements.</p><textarea id="joy-note" placeholder="A little thing that made me happy..."></textarea><input class="input" id="joy-photo" type="file" accept="image/*" style="margin-top:8px"/><p class="muted text-xs">Optional small photo. Photos use browser storage, so export backups regularly.</p><button class="add-btn" style="width:100%;padding:10px;margin-top:8px" onclick="addJoy()">+ Add a moment</button>${(data.joy||[]).slice().reverse().map(x=>`<div class="card" style="margin-top:8px"><p class="text-sm">🌸 ${escapeHtml(x.text)} <span class="muted text-xs">${x.date}</span></p>${x.photo?`<img src="${x.photo}" alt="Joy Jar memory" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px"/>`:``}<button class="text-xs" onclick="deleteJoy(${x.id})">Remove</button></div>`).join('')}</div>
 <div class="card"><p class="serif font-semibold" style="font-size:18px;margin:0 0 10px">💗 Personal savings goal</p><div class="row gap2"><input class="input" type="number" value="${g.carCurrent}" aria-label="Saved amount" oninput="onCarInput('carCurrent',this.value)"/><span>of ₦</span><input class="input" type="number" value="${g.carTarget}" aria-label="Goal amount" oninput="onCarInput('carTarget',this.value)"/></div><div class="progress" style="margin-top:12px"><div id="car-bar" class="progress-fill" style="width:${carPct}%;background:${COLORS.rose}"></div></div><span class="text-xs muted" id="car-pct">${carPct}%</span><p class="muted text-xs">Set your own target when you're ready. Saving amounts can vary.</p></div>
 <div class="card"><h3 class="serif">Financial history</h3><p class="muted text-xs">Select a period to compare past transactions. Records are retained until you remove them.</p><select onchange="financePeriod=this.value;render()"><option value="all" ${financePeriod==='all'?'selected':''}>All time</option><option value="month" ${financePeriod==='month'?'selected':''}>Selected month</option><option value="year" ${financePeriod==='year'?'selected':''}>Selected year</option></select><input class="input" type="month" value="${financeMonth}" onchange="financeMonth=this.value;render()" /></div>
 ${financeCard('personal','💗 Personal finances',['Salary','Commission','Other income','Expense','Subscription','Splurge savings transfer','Investment savings transfer','Investment purchase','Investment current value'])}
 ${financeCard('estate','🏡 Real estate finances',['Deal revenue','Commission income','Partner share payout','Ads','Tools','Subscriptions','Other expense'])}
 ${financeCard('light','💡 Light Gallery finances',['Sale revenue','Product cost','Reinvestment transfer','Owner salary','Ads','Packaging','Shipping','Other expense'])}
 ${renderBackupCard()}`;}

function compassText(s){return data.compassEdits[s.id]===undefined?s.text:data.compassEdits[s.id];}
function setCompassSection(id){compassSection=id;render();}
function editCompass(){const s=COMPASS.find(x=>x.id===compassSection);const v=prompt('Edit this section. Your changes will be saved locally:',compassText(s));if(v!==null){data.compassEdits[s.id]=v;saveData();render();}}
function renderCompass(){const current=COMPASS.find(x=>x.id===compassSection)||COMPASS[0],today=COMPASS.find(x=>x.day===new Date().getDay());return `<div class="card card-gold"><h2 class="serif" style="margin:0 0 6px">🧭 My Compass</h2><p class="muted text-sm">Return to who you are, what you value and why you are building this life.</p><p class="text-sm"><strong>Today's focus · ${today.title}</strong></p><p class="muted text-xs">Declarations live only here, not in your daily calendar.</p><div class="card" style="background:var(--surface2)"><strong>🌅 Morning declaration</strong><p class="text-sm" style="line-height:1.8">${escapeHtml(today.morning)}</p><strong>🌙 Night declaration</strong><p class="text-sm" style="line-height:1.8">${escapeHtml(today.night)}</p></div></div><div class="card"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${COMPASS.map(s=>`<button class="chip" style="border:1px solid var(--border);background:${s.id===compassSection?'var(--rose)':'var(--surface2)'};color:${s.id===compassSection?'white':'var(--text)'}" onclick="setCompassSection('${s.id}')">${escapeHtml(s.title)}</button>`).join('')}</div><h2 class="serif">${escapeHtml(current.title)}</h2>${current.head?`<p style="color:var(--rose);font-style:italic">${escapeHtml(current.head)}</p>`:''}<div style="white-space:pre-line;line-height:1.9;font-size:14px">${escapeHtml(compassText(current))}</div><button class="input" style="margin-top:18px" onclick="editCompass()">✎ Edit this section</button></div>`;}

function renderNav(){

  return `<div class="nav">${tabs.map(([id,label,emoji])=>`
    <button class="nav-item ${activeTab===id?'active':''}" onclick="setTab('${id}')">
      <span class="emoji">${emoji}</span><span>${label}</span>
    </button>`).join('')}</div>`;
}
function render(){
  const app=document.getElementById('app');
  let content='';
  if(activeTab==='today') content=renderToday();
  else if(activeTab==='week') content=renderWeek();
  else if(activeTab==='growth') content=renderGrowth();
  else if(activeTab==='compass')content=renderCompass();
  else content=renderVision();
  app.innerHTML = `
    <div class="header">
      <p class="brand serif">✿ Becoming OS</p>
      <p class="tagline">Rooted in grace. Growing in joy. · Saved on this device</p>

    ${renderNav()}`;
}
